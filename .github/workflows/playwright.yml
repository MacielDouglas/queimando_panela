name: Playwright Tests
on:
  # Desativado em push para evitar concorrência com CI no mesmo banco Neon (P1002 advisory lock).
  # Use `workflow_dispatch` para rodar manualmente ou reative `push` após separar bancos de CI/prod.
  workflow_dispatch:
  # push:
  #   branches: [main, master]
  # pull_request:
  #   branches: [main, master]

# Serializa com o workflow CI quando ambos precisarem do Neon
concurrency:
  group: queimando-panela-db-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}

      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      CI: true
      PORT: 3000
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_USER_NAME: ${{ secrets.E2E_USER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        run: bun run db:generate
      - name: Resolve stale failed migration (defensive)
        run: bunx prisma migrate resolve --rolled-back "20260704191902_init" || true
        continue-on-error: true
      - name: Reset database and run migrations
        run: |
          for i in 1 2 3; do
            echo "Tentativa $i de migrate reset..."
            bunx prisma migrate reset --force && break
            echo "Falha no advisory lock (P1002), aguardando 15s..."
            sleep 15
          done
      - name: Seed database (create e2e user)
        run: bun run db:seed
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium
      - name: Build application
        run: bun run build
      - name: Run Playwright tests
        run: bun run test:e2e -- --project chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
